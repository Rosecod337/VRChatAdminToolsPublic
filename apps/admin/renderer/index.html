<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VRChat Key Admin</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>VRChat Key Admin</h1>
          <p id="statusText">Готово</p>
        </div>
        <button id="refreshBtn" class="iconButton" title="Обновить список">Обновить</button>
      </header>

      <section class="settingsBand">
        <label>
          <span>Адрес API</span>
          <input id="serverUrl" type="url" spellcheck="false" placeholder="https://your-app.railway.app">
        </label>
        <label>
          <span>Токен администратора</span>
          <input id="adminToken" type="password" spellcheck="false" placeholder="ADMIN_TOKEN">
        </label>
        <button id="saveSettingsBtn">Сохранить</button>
      </section>

      <section class="workspace">
        <form id="createForm" class="panel">
          <div class="panelHeader">
            <h2>Быстрый ключ</h2>
          </div>
          <p class="createHint">30 дней · 1 устройство · без Owner. Имя автора — при первой активации.</p>
          <label>
            <span>Team ID (обязательно)</span>
            <input id="teamInput" type="text" maxlength="80" placeholder="fullwhite-admins" required>
          </label>
          <button type="submit" class="primary">Создать и скопировать</button>
          <details class="advancedCreateSettings">
            <summary>Дополнительные настройки</summary>
            <label>
              <span>Внутренняя метка</span>
              <input id="labelInput" type="text" maxlength="80" placeholder="Создаётся автоматически">
            </label>
            <div class="twoCols">
              <label>
                <span>Устройств</span>
                <input id="maxDevicesInput" type="number" min="1" max="50" value="1">
              </label>
              <label>
                <span>Дней после активации</span>
                <input id="validityDaysInput" type="number" min="1" max="3650" value="30">
              </label>
            </div>
            <label>
              <span>Сколько ключей</span>
              <input id="bulkCountInput" type="number" min="1" max="100" value="1">
            </label>
            <button id="bulkCreateBtn" type="button">Создать несколько</button>
          </details>
          <div class="generated">
            <span>Последний ключ</span>
            <code id="generatedKey">-</code>
            <button id="copyKeyBtn" type="button">Копировать</button>
          </div>
        </form>

        <section class="panel tablePanel">
          <div class="panelHeader licensePanelHeader">
            <h2>Лицензии</h2>
            <div class="licenseFilters">
              <input id="licenseSearch" type="search" placeholder="Ключ, Team ID, автор...">
              <select id="licenseStatusFilter" aria-label="Фильтр лицензий">
                <option value="all">Все статусы</option>
                <option value="attention">Требуют внимания</option>
                <option value="waiting">Ждут активации</option>
                <option value="active">Активные</option>
              </select>
              <select id="licenseSort" aria-label="Сортировка лицензий">
                <option value="newest">Сначала новые</option>
                <option value="attention">Сначала важные</option>
                <option value="oldest">Сначала старые</option>
              </select>
              <span id="licenseCount">0</span>
            </div>
          </div>
          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>Ключ</th>
                  <th>Метка / автор</th>
                  <th>Team ID</th>
                  <th>Права</th>
                  <th>Статус</th>
                  <th>Устройства</th>
                  <th>Срок</th>
                  <th>Активность</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="licenseRows"></tbody>
            </table>
          </div>
        </section>
      </section>

    </main>

    <script src="renderer.js"></script>
  </body>
</html>
